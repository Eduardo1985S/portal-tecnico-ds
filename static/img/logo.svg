<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circuit Board Background Elements -->
  <g opacity="0.4" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round">
    <path d="M 60 40 L 40 60 L 40 100" />
    <circle cx="60" cy="40" r="3.5" fill="#10B981" />
    <path d="M 140 40 L 160 60 L 160 100" />
    <circle cx="140" cy="40" r="3.5" fill="#38BDF8" />
    <path d="M 40 100 L 40 140 L 60 160" />
    <circle cx="60" cy="160" r="3.5" fill="#10B981" />
    <path d="M 160 100 L 160 140 L 140 160" />
    <circle cx="140" cy="160" r="3.5" fill="#3B82F6" />
  </g>

  <!-- Outer Diamond / Hex Shield -->
  <polygon points="100,20 180,100 100,180 20,100" 
           stroke="url(#primaryGrad)" 
           stroke-width="5" 
           stroke-linejoin="round" 
           fill="#0f172a" 
           fill-opacity="0.25"
           filter="url(#neonGlow)" />

  <!-- Code Bracket Left: < -->
  <path d="M 58 75 L 34 100 L 58 125" 
        stroke="url(#glowGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Code Bracket Right: > -->
  <path d="M 142 75 L 166 100 L 142 125" 
        stroke="url(#primaryGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Center Text DS (Stylized Software Developer Monogram) -->
  <text x="73" y="114" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="-1px"
        fill="#FFFFFF">D</text>
  <text x="103" y="114" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="-1px"
        fill="url(#primaryGrad)">S</text>

  <!-- Small Code Slash: / -->
  <line x1="94" y1="130" x2="106" y2="122" 
        stroke="#38BDF8" 
        stroke-width="3" 
        stroke-linecap="round" />
</svg>